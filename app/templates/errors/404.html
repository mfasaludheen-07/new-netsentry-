{% extends "base.html" %}

{% block title %}404 Not Found | NetSentry SOC{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="text-center max-w-md p-8 bg-soc-surface border border-soc-border rounded-xl shadow-2xl">
        <div class="w-16 h-16 rounded-full bg-cyan-950/80 border border-cyan-800 text-cyan-400 flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-cyan-900/30">
            <i class="fa-solid fa-radar"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">404 — Record Not Found</h1>
        <p class="text-xs text-slate-400 mb-6 leading-relaxed">
            The telemetry event, case identifier, or forensic artifact you requested does not exist or has been archived.
        </p>
        <div class="flex items-center justify-center space-x-3">
            <a href="{{ url_for('dashboard.index') }}" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-semibold transition-colors">
                <i class="fa-solid fa-house mr-1.5"></i> Dashboard
            </a>
            <button onclick="window.history.back()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-semibold transition-colors">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
