{% extends "base.html" %}

{% block title %}403 Forbidden | NetSentry SOC{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="text-center max-w-md p-8 bg-soc-surface border border-rose-900/40 rounded-xl shadow-2xl">
        <div class="w-16 h-16 rounded-full bg-rose-950/80 border border-rose-700/60 text-rose-400 flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-rose-900/30">
            <i class="fa-solid fa-ban"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">403 — Access Denied</h1>
        <p class="text-xs text-slate-400 mb-6 leading-relaxed">
            Your current security role does not have authorization to perform this operation or view this restricted forensic resource.
        </p>
        <div class="flex items-center justify-center space-x-3">
            <a href="{{ url_for('dashboard.index') }}" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-semibold transition-colors">
                <i class="fa-solid fa-house mr-1.5"></i> Dashboard
            </a>
            <button onclick="window.history.back()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-semibold transition-colors">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
